<g id="pivots" inkscape:groupmode="layer" inkscape:label="GUIDES - pivots (masquer pour export)"><g><circle cx="450" cy="405" r="7" fill="#ff00b4" stroke="#fff" stroke-width="2"/><text x="460" y="397" font-family="Arial" font-size="12" fill="#ff00b4" stroke="#fff" stroke-width="0.6" paint-order="stroke">Pivot tête/cou</text></g><g><circle cx="265" cy="455" r="7" fill="#ff00b4" stroke="#fff" stroke-width="2"/><text x="275" y="447" font-family="Arial" font-size="12" fill="#ff00b4" stroke="#fff" stroke-width="0.6" paint-order="stroke">Épaule gauche</text></g><g><circle cx="220" cy="545" r="7" fill="#ff00b4" stroke="#fff" stroke-width="2"/><text x="230" y="537" font-family="Arial" font-size="12" fill="#ff00b4" stroke="#fff" stroke-width="0.6" paint-order="stroke">Coude gauche</text></g><g><circle cx="180" cy="625" r="7" fill="#ff00b4" stroke="#fff" stroke-width="2"/><text x="190" y="617" font-family="Arial" font-size="12" fill="#ff00b4" stroke="#fff" stroke-width="0.6" paint-order="stroke">Poignet gauche</text></g><g><circle cx="635" cy="455" r="7" fill="#ff00b4" stroke="#fff" stroke-width="2"/><text x="645" y="447" font-family="Arial" font-size="12" fill="#ff00b4" stroke="#fff" stroke-width="0.6" paint-order="stroke">Épaule droite</text></g><g><circle cx="690" cy="545" r="7" fill="#ff00b4" stroke="#fff" stroke-width="2"/><text x="700" y="537" font-family="Arial" font-size="12" fill="#ff00b4" stroke="#fff" stroke-width="0.6" paint-order="stroke">Coude droit</text></g><g><circle cx="725" cy="625" r="7" fill="#ff00b4" stroke="#fff" stroke-width="2"/><text x="735" y="617" font-family="Arial" font-size="12" fill="#ff00b4" stroke="#fff" stroke-width="0.6" paint-order="stroke">Poignet droit</text></g><g><circle cx="340" cy="655" r="7" fill="#ff00b4" stroke="#fff" stroke-width="2"/><text x="350" y="647" font-family="Arial" font-size="12" fill="#ff00b4" stroke="#fff" stroke-width="0.6" paint-order="stroke">Hanche gauche</text></g><g><circle cx="335" cy="720" r="7" fill="#ff00b4" stroke="#fff" stroke-width="2"/><text x="345" y="712" font-family="Arial" font-size="12" fill="#ff00b4" stroke="#fff" stroke-width="0.6" paint-order="stroke">Genou gauche</text></g><g><circle cx="320" cy="805" r="7" fill="#ff00b4" stroke="#fff" stroke-width="2"/><text x="330" y="797" font-family="Arial" font-size="12" fill="#ff00b4" stroke="#fff" stroke-width="0.6" paint-order="stroke">Cheville gauche</text></g><g><circle cx="555" cy="655" r="7" fill="#ff00b4" stroke="#fff" stroke-width="2"/><text x="565" y="647" font-family="Arial" font-size="12" fill="#ff00b4" stroke="#fff" stroke-width="0.6" paint-order="stroke">Hanche droite</text></g><g><circle cx="555" cy="720" r="7" fill="#ff00b4" stroke="#fff" stroke-width="2"/><text x="565" y="712" font-family="Arial" font-size="12" fill="#ff00b4" stroke="#fff" stroke-width="0.6" paint-order="stroke">Genou droit</text></g><g><circle cx="575" cy="805" r="7" fill="#ff00b4" stroke="#fff" stroke-width="2"/><text x="585" y="797" font-family="Arial" font-size="12" fill="#ff00b4" stroke="#fff" stroke-width="0.6" paint-order="stroke">Cheville droite</text></g></g>
