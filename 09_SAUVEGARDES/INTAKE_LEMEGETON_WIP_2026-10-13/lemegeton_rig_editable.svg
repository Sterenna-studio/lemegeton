<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="900" height="950" viewBox="0 0 900 950">
<title>Lemegeton — rig 2D éditable</title>
<desc>Prototype de montage avec pièces séparées en groupes, pivots visibles sur un calque indépendant.</desc>
<rect width="900" height="950" fill="#f5f2eb" id="fond_apercu"/>
